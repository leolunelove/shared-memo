name: Import app source
on:
  push:
    paths: [shared-memo-source.zip]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract reviewed source
        run: unzip -o shared-memo-source.zip
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Save verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components lib public supabase tests package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.json next.config.ts next-env.d.ts .gitignore .env.example README.md AGENTS.md CLAUDE.md
          git rm shared-memo-source.zip
          git commit -m "Build private shared memo with secure viewing and 24-hour archive"
          git push
